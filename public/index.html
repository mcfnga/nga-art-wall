<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0d0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Art Wall: Paintings from the National Gallery of Art</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230e0d0c'/%3E%3Crect x='3' y='3' width='4' height='6' fill='%23c9a86a'/%3E%3Crect x='9' y='6' width='4' height='7' fill='%237f9bb0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="wall" aria-label="Scrolling wall of paintings. Touch a painting for details."></main>

  <div id="hint" aria-hidden="true">Touch any painting</div>
  <div id="status" role="status"></div>

  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" hidden>
    <div class="ring" id="ring">
      <article class="focus">
        <div class="focus-img"><img id="m-img" alt=""></div>
        <div class="focus-info">
          <p class="eyebrow" id="m-artist"></p>
          <h1 id="m-title"></h1>
          <dl>
            <div><dt>Date created</dt><dd id="m-date"></dd></div>
            <div><dt>Credit line</dt><dd id="m-credit"></dd></div>
            <div><dt>NGA.gov</dt><dd id="m-url"></dd></div>
          </dl>
          <p class="sim-note" id="m-simnote"></p>
        </div>
      </article>
    </div>
    <button class="ctl" id="m-back" type="button" aria-label="Back to previous painting" hidden>&#8592; Back</button>
    <button class="ctl" id="m-close" type="button" aria-label="Close">Close &#10005;</button>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
